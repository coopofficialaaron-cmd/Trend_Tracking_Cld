name: Probe earnings sources (one-off)

# Manual only. Read-only: fetches public endpoints and prints what works.
# Delete this file once we've picked a source.
on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe earnings-date sources
        run: python engine/probe_earnings.py
